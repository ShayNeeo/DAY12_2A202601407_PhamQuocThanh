server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://agent:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://agent:8000/health;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://agent:8000/ready;
        proxy_set_header Host $host;
    }

    location /ask {
        proxy_pass http://agent:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://agent:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://agent:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
