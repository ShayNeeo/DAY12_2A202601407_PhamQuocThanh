name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Type Error Checks & Pytest
    runs-on: ubuntu-24.04-arm
    env:
      AGENT_API_KEY: ci-test-key
      REDIS_URL: "fake://"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Linting & Syntax Check
        run: |
          python -m py_compile app/*.py

      - name: Run Pytest
        run: |
          pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    name: Build Native Image Matrix (Tags Only)
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Native Platform Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=day12-agent,push-by-digest=true,name-canonical=true,push=false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Merge Multi-Arch Manifest (Tags Only)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create Multi-Arch Manifest
        working-directory: /tmp/digests
        run: |
          echo "Merging native amd64 and arm64 images into multi-platform manifest for tag ${GITHUB_REF_NAME}..."
          # docker buildx imagetools create -t day12-agent:${GITHUB_REF_NAME} $(printf 'day12-agent@sha256:%s ' *)

  deploy:
    name: Deploy Tagged Release to VPS
    needs: [test, build, merge]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Deploying tagged version ${GITHUB_REF_NAME} multi-arch image to VPS at ${SSH_HOST}:${SSH_PORT}..."
